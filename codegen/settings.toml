# codegen benchmark configuration.
# Edit this file to change which models run and which local harness they run against.
#
# `anthropic_models` is declared first because bare TOML keys must precede any
# [table] header.

# Anthropic models for run_claude_test.py (harness = "anthropic").
anthropic_models = [
  { alias = "haiku",  model_id = "claude-haiku-4-5-20251001", enabled = true },
  { alias = "sonnet", model_id = "claude-sonnet-5",           enabled = false },
  { alias = "opus",   model_id = "claude-opus-5",             enabled = false },
]

[harness]
# default = "ollama"
default = "lmstudio"

# Each model entry:
#   alias      how the model is labelled in results, dir names, and findings (required)
#   model_id   what is sent to the harness (optional; defaults to alias)
#   think      true/false picks the mode
#   enabled    false keeps a model in the file but out of the run
#   infer_timeout / exec_timeout / max_tokens / nothink_prefix — override [defaults] per model
#
# For Ollama the `ollama pull` tag is already a fine label, so alias == the tag
# and model_id is omitted.
[harness.ollama]
base_url = "http://localhost:11434"
models = [
  { alias = "qwen3.8:27b",                  think = false, enabled = false },
  { alias = "qwen3.8:27b",                  think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3-coder:30b",              think = false, enabled = false },
  { alias = "qwen2.5-coder:7b",             think = false, enabled = false },
  { alias = "gemma4:26b",                   think = false, enabled = false },
  { alias = "gemma4:26b",                   think = true,  enabled = false, infer_timeout = 300 },
  { alias = "gemma4:31b",                   think = false, enabled = false },
  { alias = "gemma4:31b",                   think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.6:35b",                  think = false, enabled = false },
  { alias = "qwen3.6:35b",                  think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.6:35b-a3b-coding-nvfp4", think = false, enabled = false },
  { alias = "qwen3.6:35b-a3b-coding-nvfp4", think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.5:35b-a3b-coding-nvfp4", think = false, enabled = false },
  { alias = "qwen3.5:35b-a3b-coding-nvfp4", think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.5:27b",                  think = false, enabled = false },
  { alias = "qwen3.5:27b",                  think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.5:27b-nvfp4",            think = false, enabled = false },
  { alias = "qwen3.5:27b-nvfp4",            think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.5:4b",                   think = false, enabled = false },
  { alias = "qwen3.5:4b",                   think = true,  enabled = false, infer_timeout = 300 },
  { alias = "qwen3.5:4b-nvfp4",             think = false, enabled = false },
  { alias = "qwen3.5:4b-nvfp4",             think = true,  enabled = false, infer_timeout = 300 },
]

# LM Studio: `model_id` is the id LM Studio's server reports at GET /v1/models
# (the model key, plus an `@variant` suffix to pick a quant — `@q4_k_m` etc. are
# GGUF, `@4bit`/`@8bit` are MLX). `alias` is our own runtime-explicit label, so
# the runtime is visible in results and dir names without decoding the id.
# This list is independent of the Ollama list — the same weights have different
# ids and quantizations across the two runtimes, so results are kept separate.
# autostart: run `lms server start` if the server is not already up, and
# `lms server stop` at the end (only if we started it). Needs the `lms` CLI.
# LM Studio applies its own generation defaults and chat template, which can
# make some models much more verbose than the same weights under Ollama —
# hence the longer infer_timeout here. max_tokens (see [defaults]) caps
# true runaway output.
#
# nothink_prefix: WORKAROUND for a LM Studio bug — its MLX engine ignores
# `enable_thinking: false` for Qwen 3.5/3.6/3.8, so a `think = false` model
# reasons anyway (LM Studio bug tracker #1559, #1870, #1933). Confirmed broken
# on LM Studio 0.4.22 / mlx-llm 1.11.0 (2026-08). On a `think = false` run this
# string is appended as a trailing assistant message; LM Studio treats it as a
# response prefix so the model continues *after* the (empty) think block. The
# value is the Qwen `<think></think>` skip token — harmless for GGUF builds
# that honor enable_thinking natively, but it BREAKS models with no <think>
# mechanism (e.g. qwen3-coder emits an empty response), so those set
# `nothink_prefix = ""` on their own entry to opt out.
# >>> When you upgrade LM Studio: set this to "" and run one `think = false`
#     cell — if `reasoning_tokens` is ~0, the bug is fixed and you can delete it.
[harness.lmstudio]
base_url = "http://localhost:1234"
autostart = true
nothink_prefix = "<think>\n\n</think>\n\n"
models = [
  # qwen3.8:27b — same weights, three quants. Compare against Ollama's qwen3.8:27b.
  # GGUF honors enable_thinking natively (the bug is MLX-only), so it opts out of
  # the nothink_prefix hack; the MLX nothink entry needs it.
  { alias = "qwen3.8-27b-gguf-q4km", model_id = "qwen/qwen3.8-27b@q4_k_m", think = false, enabled = true,  infer_timeout = 300, nothink_prefix = "" },
  { alias = "qwen3.8-27b-mlx-4bit",  model_id = "qwen/qwen3.8-27b@4bit",   think = false, enabled = false, infer_timeout = 300 },                      # nothink needs the hack; done, n=5
  { alias = "qwen3-coder-30b-mlx",   model_id = "qwen/qwen3-coder-30b",    think = false, enabled = false, infer_timeout = 300, nothink_prefix = "" },  # no <think> mechanism; done, n=5
  # { alias = "qwen3.8-27b-mlx-8bit", model_id = "qwen/qwen3.8-27b@8bit",   think = false, enabled = false, infer_timeout = 300 },                      # ~2x slower for no quality gain; see FINDINGS
  # think mode reasons ~3300 tokens/cell, so max_tokens is raised to leave room
  # for the solution on top of the reasoning. Slowest + flakiest — runs last.
  { alias = "qwen3.8-27b-mlx-4bit",  model_id = "qwen/qwen3.8-27b@4bit",   think = true,  enabled = false, infer_timeout = 600, max_tokens = 8192 },    # done, n=3, score 94
]

[harness.apple]
base_url = "http://localhost:11435"
autostart = true

[defaults]
infer_timeout = 120   # seconds; per-model override allowed in each harness's models list
exec_timeout  = 60    # seconds; per-model override allowed in each harness's models list
max_tokens    = 4096  # generation cap (Ollama num_predict / OpenAI max_tokens); stops runaway output
languages = ["python", "typescript", "go", "csharp"]

# Decoding parameters sent identically to every harness, so a model behaves the
# same under Ollama and LM Studio and only the *model* is being compared. These
# are qwen3.8:27b's own Ollama defaults (`ollama show qwen3.8:27b`), so Ollama
# runs are unchanged. Adjust for a different model family, or delete this section
# to let each harness fall back to its own per-model defaults.
[sampling]
temperature    = 1
top_k          = 20
top_p          = 0.95
min_p          = 0
repeat_penalty = 1
