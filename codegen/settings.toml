# codegen benchmark configuration.
# Edit this file to change which models run and which local harness they run against.
#
# `anthropic_models` is declared first because bare TOML keys must precede any
# [table] header.

# Anthropic models for run_claude_test.py (harness = "anthropic").
anthropic_models = [
  { alias = "haiku",  model_id = "claude-haiku-4-5-20251001", enabled = true },
  { alias = "sonnet", model_id = "claude-sonnet-5",           enabled = false },
  { alias = "opus",   model_id = "claude-opus-5",             enabled = false },
]

[harness]
# default = "ollama"
default = "lmstudio"

# Ollama models are identified by their `ollama pull` tag.
# `enabled = false` keeps a model in the file but out of the run.
# `think = true/false` picks the mode; `infer_timeout` overrides [defaults] per model.
[harness.ollama]
base_url = "http://localhost:11434"
models = [
  { name = "qwen3.8:27b",                  think = false, enabled = false },
  { name = "qwen3.8:27b",                  think = true,  enabled = false,  infer_timeout = 300 },
  { name = "qwen3-coder:30b",              think = false, enabled = false },
  { name = "qwen2.5-coder:7b",             think = false, enabled = false },
  { name = "gemma4:26b",                   think = false, enabled = false },
  { name = "gemma4:26b",                   think = true,  enabled = false, infer_timeout = 300 },
  { name = "gemma4:31b",                   think = false, enabled = false },
  { name = "gemma4:31b",                   think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.6:35b",                  think = false, enabled = false },
  { name = "qwen3.6:35b",                  think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.6:35b-a3b-coding-nvfp4", think = false, enabled = false },
  { name = "qwen3.6:35b-a3b-coding-nvfp4", think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.5:35b-a3b-coding-nvfp4", think = false, enabled = false },
  { name = "qwen3.5:35b-a3b-coding-nvfp4", think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.5:27b",                  think = false, enabled = false },
  { name = "qwen3.5:27b",                  think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.5:27b-nvfp4",            think = false, enabled = false },
  { name = "qwen3.5:27b-nvfp4",            think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.5:4b",                   think = false, enabled = false },
  { name = "qwen3.5:4b",                   think = true,  enabled = false, infer_timeout = 300 },
  { name = "qwen3.5:4b-nvfp4",             think = false, enabled = false },
  { name = "qwen3.5:4b-nvfp4",             think = true,  enabled = false, infer_timeout = 300 },
]

# LM Studio models are identified by the id LM Studio's server reports at
# GET /v1/models (usually the lowercased model key, e.g. "qwen3.8-27b-mlx-4bit").
# This list is independent of the Ollama list — the same weights have different
# ids and quantizations across the two runtimes, so results are kept separate.
# autostart: run `lms server start` if the server is not already up, and
# `lms server stop` at the end (only if we started it). Needs the `lms` CLI.
# LM Studio applies its own generation defaults and chat template, which can
# make some models much more verbose than the same weights under Ollama —
# hence the longer infer_timeout here. max_tokens (see [defaults]) caps
# true runaway output.
[harness.lmstudio]
base_url = "http://localhost:1234"
autostart = true
models = [
  { name = "qwen3.8-27b-mlx",      think = false, enabled = true,  infer_timeout = 300 },
  { name = "qwen3.8-27b-mlx",      think = true,  enabled = true,  infer_timeout = 600 },
  { name = "qwen/qwen3-coder-30b", think = false, enabled = false, infer_timeout = 300 },
]

[harness.apple]
base_url = "http://localhost:11435"
autostart = true

[defaults]
infer_timeout = 120   # seconds; per-model override allowed in each harness's models list
exec_timeout  = 60    # seconds; per-model override allowed in each harness's models list
max_tokens    = 4096  # generation cap (Ollama num_predict / OpenAI max_tokens); stops runaway output
languages = ["python", "typescript", "go", "csharp"]

# Decoding parameters sent identically to every harness, so a model behaves the
# same under Ollama and LM Studio and only the *model* is being compared. These
# are qwen3.8:27b's own Ollama defaults (`ollama show qwen3.8:27b`), so Ollama
# runs are unchanged. Adjust for a different model family, or delete this section
# to let each harness fall back to its own per-model defaults.
[sampling]
temperature    = 1
top_k          = 20
top_p          = 0.95
min_p          = 0
repeat_penalty = 1
